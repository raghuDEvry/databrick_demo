resources:
  pipelines:
    demo_dlt_pipeline:
      name: demo_dlt_pipeline
      development: true
      configuration:
        spark.master: local[*]
      clusters:
        - label: default
          num_workers: 2
          spark_version: 13.3.x-scala2.12
          node_type_id: Standard_DS3_v2
      libraries:
        - notebook:
            path: ./src/dlt_pipeline.py
